name: Daily data update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest source data
        run: python3 scripts/fetch_source.py

      - name: Resolve real station URLs (incremental)
        run: python3 scripts/resolve_urls.py --limit 400

      - name: Rebuild stations page and picks
        run: python3 scripts/build_stations.py

      - name: Refresh sitemap lastmod
        run: python3 scripts/update_sitemap.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ stations/index.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: daily data refresh"
          git push
